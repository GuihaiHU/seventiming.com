<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #f2f3ef;
        color: #101210;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px 54px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        background: #101210;
        color: #f2f3ef;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        max-width: 940px;
        margin: 0;
        font-size: 104px;
        font-weight: 500;
        line-height: 0.94;
        letter-spacing: -0.055em;
      }

      .bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-top: 22px;
        border-top: 1px solid #c9cec5;
        font-size: 19px;
        line-height: 1.2;
      }

      .studio {
        color: #596057;
      }

      .domain {
        color: #2028ff;
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 16px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <span class="mark">7</span>
      <span>SevenTiming</span>
    </div>

    <h1>Small software,<br />built with care.</h1>

    <div class="bottom">
      <span class="studio">Independent software studio</span>
      <span class="domain">seventiming.com</span>
    </div>
  </body>
</html>
