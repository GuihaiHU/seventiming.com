# seventiming.com — static Next.js export served from /var/www/seventiming.com
#
# This file is the source of truth for the sf03 vhost. Install it with:
#   scp deploy/nginx/seventiming.com.conf sf03:/etc/nginx/sites-available/seventiming.com
#   ssh sf03 'nginx -t && systemctl reload nginx'
#
# The TLS parts were written by Certbot:
#   certbot --nginx -d seventiming.com -d www.seventiming.com --redirect
# Renewal runs from the certbot timer. After editing this file, run
#   ssh sf03 'nginx -t && systemctl reload nginx && certbot renew --dry-run'
# to prove renewal still works.

server {
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2; # managed by Certbot
    server_name seventiming.com;

    root /var/www/seventiming.com;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/seventiming.com.access.log;
    error_log  /var/log/nginx/seventiming.com.error.log;

    ssl_certificate /etc/letsencrypt/live/seventiming.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seventiming.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Certbot HTTP-01 challenges, kept so renewals can validate.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
        default_type "text/plain";
    }

    # Hashed build assets are immutable.
    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The export uses trailing slashes: /privacy/ -> /privacy/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# www is not a canonical host: one hop to the apex over HTTPS.
server {
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2; # managed by Certbot
    server_name www.seventiming.com;

    ssl_certificate /etc/letsencrypt/live/seventiming.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/seventiming.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
        default_type "text/plain";
    }

    location / {
        return 301 https://seventiming.com$request_uri;
    }
}

# Plain HTTP for both names: straight to the apex over HTTPS, one hop.
server {
    listen 80;
    listen [::]:80;
    server_name seventiming.com www.seventiming.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
        default_type "text/plain";
    }

    location / {
        return 301 https://seventiming.com$request_uri;
    }
}
